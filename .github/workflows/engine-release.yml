name: Engine Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install engine dependencies
        run: npm install --prefix engine --no-audit --no-fund
      - name: Validate release
        run: npm run lint && npm run typecheck && npm run validate
      - name: Pack distributable
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tgz engine/engine.version.json --generate-notes

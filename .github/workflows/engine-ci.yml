name: Engine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package.json
      - name: Install engine dependencies
        run: npm install --prefix engine --no-audit --no-fund
      - name: Install export tools
        run: sudo apt-get update && sudo apt-get install -y chromium imagemagick
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:smoke
